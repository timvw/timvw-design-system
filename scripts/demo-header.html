<header class="docs-header">
  <a class="docs-brand" href="./"><span class="docs-mark" aria-hidden="true">tw</span><span><strong>timvw</strong><small>Design system</small></span></a>
  <div class="docs-controls">
    {{VERSION_PICKER}}
    <div class="docs-theme-picker" data-theme-picker role="group" aria-label="Color theme" hidden>
      <button class="docs-theme-button" type="button" data-theme="light" aria-label="Light theme" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <span class="docs-theme-tip" aria-hidden="true">Light</span>
      </button>
      <button class="docs-theme-button" type="button" data-theme="dark" aria-label="Dark theme" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.6 8.6 0 0 1 11 3.5a8.6 8.6 0 1 0 9.5 9.5Z"/></svg>
        <span class="docs-theme-tip" aria-hidden="true">Dark</span>
      </button>
      <button class="docs-theme-button" type="button" data-theme="system" aria-label="Use system theme" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg>
        <span class="docs-theme-tip" aria-hidden="true">System</span>
      </button>
    </div>
    <a href="https://github.com/timvw/timvw-design-system">GitHub ↗</a>
  </div>
</header>
