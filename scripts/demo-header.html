<header class="docs-header">
  <a class="docs-brand" href="./"><span class="docs-mark" aria-hidden="true">tw</span><span><strong>timvw</strong><small>Design system</small></span></a>
  <div class="docs-controls">
    <a class="tvw-button tvw-button--quiet" href="./explore.html"><svg class="tvw-icon" aria-hidden="true"><use href="./icons.svg#search"></use></svg> Search</a>
    {{VERSION_PICKER}}
    <div class="tvw-theme-picker" data-tvw-theme-picker role="group" aria-label="Color theme" hidden>
      <button class="tvw-button tvw-button--icon" type="button" data-theme="light" title="Light" aria-label="Light theme" aria-pressed="false">
        <svg class="tvw-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      </button>
      <button class="tvw-button tvw-button--icon" type="button" data-theme="dark" title="Dark" aria-label="Dark theme" aria-pressed="false">
        <svg class="tvw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.6 8.6 0 0 1 11 3.5a8.6 8.6 0 1 0 9.5 9.5Z"/></svg>
      </button>
      <button class="tvw-button tvw-button--icon" type="button" data-theme="system" title="System" aria-label="Use system theme" aria-pressed="false">
        <svg class="tvw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg>
      </button>
    </div>
    <a class="tvw-button tvw-button--secondary" href="https://github.com/timvw/timvw-design-system" aria-label="GitHub repository"><svg class="tvw-icon" aria-hidden="true"><use href="./icons.svg?v=github#github"></use></svg> GitHub</a>
  </div>
</header>
